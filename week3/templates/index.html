<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Waste Classification Assistant</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <header>
    <h1>Waste Classification Assistant</h1>
    <p class="sub">
      Upload a photo of a single item of waste. The model names its category and
      reports how confident it is.
    </p>
  </header>

  <div class="alert" id="alert" hidden></div>

  <form id="form">
    <label class="drop" id="drop" for="image" tabindex="0">
      <span class="drop-icon">＋</span>
      <span class="drop-title">Choose a photo</span>
      <span class="drop-hint">or drag one here &middot; JPG, PNG, BMP or WebP, up to 10 MB</span>
      <img id="preview" alt="" hidden>
    </label>
    <input id="image" name="image" type="file" accept="image/*" required>


    <button type="submit" id="submit" disabled>Classify this image</button>
  </form>

  <section class="result" id="result" hidden>
    <div class="thumb">
      <img id="result-image" alt="The image that was classified">
    </div>

    <div class="verdict-box">
      <p class="eyebrow">Prediction</p>
      <p class="verdict">
        <span id="result-label"></span>
        <span class="conf" id="result-confidence"></span>
      </p>

      <p class="eyebrow">All classes ranked</p>
      <ul class="bars" id="result-bars"></ul>
    </div>
  </section>



</main>

<script>


  const form = document.getElementById('form');
  const input = document.getElementById('image');
  const drop = document.getElementById('drop');
  const preview = document.getElementById('preview');
  const submit = document.getElementById('submit');
  const alertBox = document.getElementById('alert');
  const result = document.getElementById('result');
  const resultImage = document.getElementById('result-image');
  const resultLabel = document.getElementById('result-label');
  const resultConfidence = document.getElementById('result-confidence');
  const resultBars = document.getElementById('result-bars');
  const checkpoint = document.getElementById('checkpoint');

  let imageUrl = null;      // object URL of the chosen file, shown as the thumbnail
  let modelReady = false;   // set by checkHealth()

  function showAlert(message) {
    alertBox.textContent = message;
    alertBox.hidden = !message;
  }

  function showPreview(file) {
    if (!file || !file.type.startsWith('image/')) return;
    imageUrl = URL.createObjectURL(file);
    preview.src = imageUrl;
    preview.hidden = false;
    drop.classList.add('has-file');
  }

  function renderResult(data) {
    resultImage.src = imageUrl;
    resultLabel.textContent = data.label;
    resultConfidence.textContent = (data.confidence * 100).toFixed(1) + '% confident';

    // Rebuild the ranking from the JSON: [{label, confidence}, ...] -> one li each.
    resultBars.replaceChildren();
    for (const item of data.top_k) {
      const percent = (item.confidence * 100).toFixed(1);

      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = item.label;

      const bar = document.createElement('span');
      bar.className = 'bar';
      const fill = document.createElement('i');
      fill.style.width = percent + '%';
      bar.append(fill);

      const pct = document.createElement('span');
      pct.className = 'pct';
      pct.textContent = percent + '%';

      const row = document.createElement('li');
      row.append(name, bar, pct);
      resultBars.append(row);
    }

    result.hidden = false;
  }

  async function checkHealth() {
    try {
      const info = await (await fetch('/healthz')).json();
      if (info.status === 'ok') {
        modelReady = true;
        checkpoint.textContent = info.checkpoint.split(/[\\/]/).pop();
        submit.disabled = false;
      } else {
        checkpoint.textContent = 'no model';
        showAlert('No trained model is loaded, so predictions are unavailable.');
        console.error(info.error);
      }
    } catch (error) {
      checkpoint.textContent = 'unreachable';
      showAlert('Could not reach the server: ' + error);
    }
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();                  // the page never navigates away
    if (!modelReady || !input.files.length) return;

    showAlert('');
    result.hidden = true;
    submit.disabled = true;
    submit.textContent = 'Classifying…';

    const body = new FormData();
    body.append('image', input.files[0]);

    try {
      const response = await fetch('/api/predict', { method: 'POST', body });
      const data = await response.json();
      if (data.ok) {
        renderResult(data);
      } else {
        showAlert(data.error || 'Something went wrong.');
      }
    } catch (error) {
      showAlert('Prediction request failed: ' + error);
    } finally {
      submit.disabled = false;
      submit.textContent = 'Classify this image';
    }
  });

  input.addEventListener('change', () => showPreview(input.files[0]));

  ['dragenter', 'dragover'].forEach((name) =>
    drop.addEventListener(name, (event) => {
      event.preventDefault();
      drop.classList.add('over');
    })
  );
  ['dragleave', 'drop'].forEach((name) =>
    drop.addEventListener(name, (event) => {
      event.preventDefault();
      drop.classList.remove('over');
    })
  );
  drop.addEventListener('drop', (event) => {
    if (event.dataTransfer.files.length) {
      input.files = event.dataTransfer.files;
      showPreview(event.dataTransfer.files[0]);
    }
  });

  checkHealth();
</script>
</body>
</html>
